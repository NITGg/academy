services:
  app:
    build: .
    container_name: academy_app
    ports:
      - "8081:80"
    volumes:
      - ./src:/var/www/html
      - ./moodleData:/var/www/moodledata
    environment:
      - MOODLE_WWWROOT
      - DB_HOST
      - DB_NAME
      - DB_USER
      - DB_PASS
      - MOODLE_SSLPROXY
    depends_on:
      - db
    entrypoint: >
      sh -c "chown -R www-data:www-data /var/www/moodledata &&
             chmod -R 755 /var/www/moodledata &&
             docker-php-entrypoint apache2-foreground"

  db:
    image: mariadb:10.6
    container_name: academy_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: academy2022_moodle
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --innodb-file-per-table=1
      --skip-character-set-client-handshake
      --innodb-buffer-pool-size=512M
      --innodb-log-file-size=128M
      --innodb-flush-log-at-trx-commit=2
      --innodb-flush-method=O_DIRECT
      --query-cache-type=1
      --query-cache-size=64M
      --query-cache-limit=2M
      --tmp-table-size=64M
      --max-heap-table-size=64M
      --table-open-cache=2000
      --sort-buffer-size=4M
      --join-buffer-size=4M
      --slow-query-log=1
      --long-query-time=1
    volumes:
      - academy_db_data:/var/lib/mysql
      - ./moodleData:/docker-entrypoint-initdb.d
    ports:
      - "3307:3306"

  # ── Jitsi (official Docker setup) ──────────────────────────
  jitsi-web:
    image: jitsi/web:stable-9823
    container_name: academy_jitsi_web
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8080}:80"
      - "${HTTPS_PORT:-8443}:443"
    volumes:
      - ${CONFIG:-./jitsi}/web:/config:Z
      - ${CONFIG:-./jitsi}/transcripts:/usr/share/jitsi-meet/transcripts:Z
    environment:
      - DISABLE_HTTPS
      - ENABLE_HTTP_REDIRECT
      - ENABLE_AUTH
      - ENABLE_GUESTS
      - ENABLE_RECORDING
      - ENABLE_BREAKOUT_ROOMS
      - PUBLIC_URL
      - TZ
      - AUTH_TYPE
      - JWT_APP_ID
      - JWT_APP_SECRET
      - JWT_ACCEPTED_ISSUERS
      - JWT_ACCEPTED_AUDIENCES
      - XMPP_DOMAIN=meet.jitsi
      - XMPP_AUTH_DOMAIN=auth.meet.jitsi
      - XMPP_BOSH_URL_BASE=http://xmpp.meet.jitsi:5280
      - XMPP_GUEST_DOMAIN=guest.meet.jitsi
      - XMPP_MUC_DOMAIN=muc.meet.jitsi
      - XMPP_RECORDER_DOMAIN=recorder.meet.jitsi
      - XMPP_INTERNAL_MUC_DOMAIN=internal-muc.meet.jitsi
      - JICOFO_AUTH_USER=focus
      - JIBRI_XMPP_USER=jibri
      - JIBRI_XMPP_PASSWORD
      - JIBRI_RECORDER_USER=recorder
      - JIBRI_RECORDER_PASSWORD
    depends_on:
      - prosody
    networks:
      meet.jitsi:
        aliases:
          - meet.jitsi

  prosody:
    image: jitsi/prosody:stable-9823
    container_name: academy_prosody
    restart: unless-stopped
    expose:
      - "5222"
      - "5347"
      - "5280"
    volumes:
      - ${CONFIG:-./jitsi}/prosody/config:/config:Z
      - ${CONFIG:-./jitsi}/prosody/prosody-plugins-custom:/prosody-plugins-custom:Z
    environment:
      - ENABLE_AUTH
      - ENABLE_GUESTS
      - ENABLE_RECORDING
      - PUBLIC_URL
      - TZ
      - AUTH_TYPE
      - JWT_APP_ID
      - JWT_APP_SECRET
      - JWT_ACCEPTED_ISSUERS
      - JWT_ACCEPTED_AUDIENCES
      - XMPP_DOMAIN=meet.jitsi
      - XMPP_AUTH_DOMAIN=auth.meet.jitsi
      - XMPP_GUEST_DOMAIN=guest.meet.jitsi
      - XMPP_MUC_DOMAIN=muc.meet.jitsi
      - XMPP_INTERNAL_MUC_DOMAIN=internal-muc.meet.jitsi
      - XMPP_RECORDER_DOMAIN=recorder.meet.jitsi
      - XMPP_CROSS_DOMAIN=true
      - GLOBAL_MODULES=bosh,websocket,http_files
      - XMPP_MODULES=bosh,websocket
      - XMPP_MUC_MODULES=token_affiliation
      - JICOFO_AUTH_USER=focus
      - JICOFO_AUTH_PASSWORD
      - JICOFO_COMPONENT_SECRET=s3cr37
      - JIBRI_XMPP_USER=jibri
      - JIBRI_XMPP_PASSWORD
      - JIBRI_RECORDER_USER=recorder
      - JIBRI_RECORDER_PASSWORD
      - JVB_AUTH_USER=jvb
      - JVB_AUTH_PASSWORD
    networks:
      meet.jitsi:
        aliases:
          - xmpp.meet.jitsi

  jicofo:
    image: jitsi/jicofo:stable-9823
    container_name: academy_jicofo
    restart: unless-stopped
    volumes:
      - ${CONFIG:-./jitsi}/jicofo:/config:Z
    environment:
      - TZ
      - XMPP_DOMAIN=meet.jitsi
      - XMPP_AUTH_DOMAIN=auth.meet.jitsi
      - XMPP_MUC_DOMAIN=muc.meet.jitsi
      - XMPP_INTERNAL_MUC_DOMAIN=internal-muc.meet.jitsi
      - XMPP_SERVER=xmpp.meet.jitsi
      - JICOFO_AUTH_USER=focus
      - JICOFO_AUTH_PASSWORD
      - JICOFO_COMPONENT_SECRET=s3cr37
      - JIBRI_BREWERY_MUC=jibribrewery
      - JIBRI_PENDING_TIMEOUT=90
      - ENABLE_RECORDING=1
    depends_on:
      - prosody
    networks:
      - meet.jitsi

  jvb:
    image: jitsi/jvb:stable-9823
    container_name: academy_jvb
    restart: unless-stopped
    ports:
      - "10000:10000/udp"
    volumes:
      - ${CONFIG:-./jitsi}/jvb:/config:Z
    environment:
      - TZ
      - XMPP_AUTH_DOMAIN=auth.meet.jitsi
      - XMPP_INTERNAL_MUC_DOMAIN=internal-muc.meet.jitsi
      - XMPP_SERVER=xmpp.meet.jitsi
      - JVB_AUTH_USER=jvb
      - JVB_AUTH_PASSWORD
      - JVB_PORT=10000
      - JVB_STUN_SERVERS=meet-jit-si-turnrelay.jitsi.net:443
      - DOCKER_HOST_ADDRESS=host.docker.internal
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - prosody
    networks:
      - meet.jitsi

  jibri:
    image: jitsi/jibri:stable-9823
    container_name: academy_jibri
    restart: unless-stopped
    ports:
      - "2223:2223"   # Jibri HTTP API — health: http://localhost:2223/jibri/api/v1.0/health
    volumes:
      - ${CONFIG:-./jitsi}/jibri:/config:Z
      - /dev/shm:/dev/shm
      - ${CONFIG:-./jitsi}/recordings:/config/recordings:Z
    cap_add:
      - SYS_ADMIN
      - NET_BIND_SERVICE
    environment:
      - TZ
      - XMPP_AUTH_DOMAIN=auth.meet.jitsi
      - XMPP_INTERNAL_MUC_DOMAIN=internal-muc.meet.jitsi
      - XMPP_RECORDER_DOMAIN=recorder.meet.jitsi
      - XMPP_SERVER=xmpp.meet.jitsi
      - XMPP_DOMAIN=meet.jitsi
      - JIBRI_XMPP_USER=jibri
      - JIBRI_XMPP_PASSWORD
      - JIBRI_RECORDER_USER=recorder
      - JIBRI_RECORDER_PASSWORD
      - JIBRI_BREWERY_MUC=jibribrewery
      - JIBRI_RECORDING_DIR=/config/recordings
      - JIBRI_FINALIZE_RECORDING_SCRIPT_PATH=/config/finalize.sh
      - DISPLAY=:0
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin123
      - MINIO_BUCKET=academy-recordings
      - JIBRI_HTTP_API_EXTERNAL_PORT=2223
      - IGNORE_CERTIFICATE_ERRORS=1
      - PUBLIC_URL=https://meet.jitsi
      - MOODLE_URL=http://academy_app
      - MOODLE_CRON_KEY=academy-cron-2024
    depends_on:
      - jicofo
    networks:
      - meet.jitsi

  # ── MinIO ──────────────────────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: academy_minio
    restart: always
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    command: server /data --console-address ":9001"
    networks:
      - meet.jitsi
      - default


  # ── Excalidraw ─────────────────────────────────────────────
  # WebSocket collaboration relay (Socket.IO)
  excalidraw-room:
    image: excalidraw/excalidraw-room:latest
    container_name: academy_excalidraw_room
    restart: always
    ports:
      - "9090:80"

  # Excalidraw frontend app — built to use the local relay above
  excalidraw-app:
    build:
      context: ./excalidraw
      args:
        VITE_APP_WS_SERVER_URL: wss://academy2026.nitg-eg.com/whiteboard-ws
    container_name: academy_excalidraw_app
    restart: always
    ports:
      - "9091:80"
    depends_on:
      - excalidraw-room

networks:
  meet.jitsi:

volumes:
  academy_db_data:
  minio_data:
