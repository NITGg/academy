<!-- NIT - Category PHOTO CARDS, home-page block (Figma "home 13").
     Paste into an HTML block on the FRONT PAGE (Site home), in place of the
     current categories block.

     From top to bottom:
       the two corner controls - the language swap and the light/dark switch;
       the BIG site logo on a curved band;
       a heading (a small eyebrow line over a big title);
       a grid of the site's top-level categories, three per row on a desktop,
       two on a tablet, one on a phone.

     Each card is a link to that category and shows:
       the category IMAGE as the photo filling the card,
       a scrim over it in the page background colour,
       the category LOGO (the one uploaded on the category's "Change style"
       tab - the light-mode logo in light mode, the dark-mode logo in dark),
       the category name.
     A category with no logo for the current mode shows the site logo for that
     mode instead. Hovering a card zooms its photo only; the logo and the name
     stay where they are.

     DIRECTION follows the interface language: in Arabic the logo and the name
     start on the right of the card, in English on the left, whatever language
     the category name itself is written in.

     THE BIG LOGO is the site's wide lock-up, window.NIT_LOGO_FULL (Site
     administration then Appearance then Logos), filled in by the script. It
     carries data-nit-logo="full" so the light/dark switch swaps it together
     with the navbar's mark. The picture in the markup is only the fallback.

     THE TWO CONTROLS are copies of the navbar's own, with the same contract as
     the hero block (home_6_categories1.html): window.NIT_LANG_TOGGLE and
     window.NIT_MODE_TOGGLE, printed by the front-page layout from the very
     renderer methods the navbar uses. The small script right after them primes
     both BEFORE the theme's click handler binds - it reads the config once,
     when it binds, so this cannot wait for the external script. A payload that
     is null (one language installed; both modes on the same group) hides that
     button.

     ALL OTHER BEHAVIOUR LIVES IN theme/nit/blocks/home_categories_cards.js,
     served by js.php beside it, so a fix to the cards ships with a git pull and
     never needs a re-paste.

     WHERE THE CATEGORIES COME FROM - window.NIT_CATEGORIES, printed by theme_nit's
     front-page layout, so this block belongs on the front page.

     WHICH categories, and in what order, is data-ids on the grid element: a
     plain list of category ids, drawn in that order. Empty = the first
     data-limit the site returns. The ids are visible in the address bar on
     course/management.php.

     COLOURS read from the Brand Colors palette (--nit-brand-*): the eyebrow is
     Primary, the title and card text are Text primary, the scrim and the curved
     band are the page Background, the controls use Surface, Border primary and
     the hover roles. The light/dark switch repaints everything with no reload.

     House rules, each learned the hard way: never write a tag - a less-than
     sign followed by a letter and closed by a greater-than sign - anywhere in
     these comments (HTML Purifier eats everything before it); no bare web
     address and no less-than character inside a script; no empty elements (the
     editor deletes them, which is why the grid holds a placeholder line the
     script replaces); no {mlang} markup inside an attribute.

     The two heading lines are bilingual {mlang} text, so this needs
     local_nit_mlang's "Include rich text editors" OFF and the "Multi-language
     content (v2)" filter ON - the same as home_6_categories2.html. Paste into an
     EMPTY block.

     The fallback logo is prefixed with the /moodle-new/ sub-directory this
     site is installed under. Change that prefix if wwwroot moves. -->
<div
  style="position: relative; overflow: hidden; background: var(--nit-brand-background); color: var(--nit-brand-textprimary); padding: 64px clamp(16px, 4vw, 48px) clamp(40px, 6vw, 80px);"
  data-nit-catcards="">
  <!-- The curved band behind the logo. Its colour and shadow are set by the
       script's stylesheet from the palette, not here. -->
  <svg viewBox="0 0 1444 338" preserveAspectRatio="none" aria-hidden="true"
    data-nit-catcards-arc="">
    <path d="M0 292.9C568.3 350.4 884.9 355.6 1444 292.9V0H0Z"></path>
  </svg>
  <!-- Corner controls: the language swap, then the light/dark switch. -->
  <div
    style="position: absolute; top: 16px; inset-inline-end: max(clamp(16px, 4vw, 48px), calc((100% - 1280px) / 2)); z-index: 2; display: flex; align-items: center; gap: 10px;"
    data-nit-catcards-tools=""> <a dir="ltr"
      style="display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 14px 0 12px; border-radius: 999px; border: 1px solid var(--nit-brand-borderprimary); background: color-mix(in srgb, var(--nit-brand-surface) 72%, transparent); color: var(--nit-brand-textprimary); font-size: 14px; font-weight: 600; letter-spacing: .06em; line-height: 1; text-decoration: none;"
      href="#" data-nit-hero-tool="" data-nit-hero-lang=""><svg width="18"
        height="18" viewBox="0 0 24 24" aria-hidden="true"
        style="flex: 0 0 auto; display: block;">
        <path fill="currentColor"
          d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zm6.93 6h-2.95a15.65 15.65 0 0 0-1.38-3.56A8.03 8.03 0 0 1 18.92 8zM12 4.04c.83 1.2 1.48 2.53 1.91 3.96h-3.82c.43-1.43 1.08-2.76 1.91-3.96zM4.26 14C4.1 13.36 4 12.69 4 12s.1-1.36.26-2h3.38c-.08.66-.14 1.32-.14 2s.06 1.34.14 2H4.26zm.82 2h2.95c.32 1.25.78 2.45 1.38 3.56A7.987 7.987 0 0 1 5.08 16zm2.95-8H5.08a7.987 7.987 0 0 1 4.33-3.56A15.65 15.65 0 0 0 8.03 8zM12 19.96c-.83-1.2-1.48-2.53-1.91-3.96h3.82c-.43 1.43-1.08 2.76-1.91 3.96zM14.34 14H9.66c-.09-.66-.16-1.32-.16-2s.07-1.35.16-2h4.68c.09.65.16 1.32.16 2s-.07 1.34-.16 2zm.25 5.56c.6-1.11 1.06-2.31 1.38-3.56h2.95a8.03 8.03 0 0 1-4.33 3.56zM16.36 14c.08-.66.14-1.32.14-2s-.06-1.34-.14-2h3.38c.16.64.26 1.31.26 2s-.1 1.36-.26 2h-3.38z">
        </path>
      </svg><span data-nit-hero-lang-label="">AR</span></a> <a
      class="nit-mode-toggle"
      style="display: inline-flex; align-items: center; justify-content: center; width: 40px; height: 40px; padding: 0; border-radius: 50%; cursor: pointer; border: 1px solid var(--nit-brand-borderprimary); background: color-mix(in srgb, var(--nit-brand-surface) 72%, transparent); color: var(--nit-brand-textprimary); line-height: 1; text-decoration: none;"
      href="#" role="button" data-nit-hero-tool="" data-nit-hero-mode=""
      data-nit-mode-toggle="" data-nit-mode="dark"><svg
        class="nit-mode-icon nit-mode-icon-dark" width="20" height="20"
        viewBox="0 0 24 24" aria-hidden="true" style="display: none;">
        <path fill="currentColor"
          d="M12 3a9 9 0 1 0 9 9c0-.46-.04-.92-.1-1.36a5.389 5.389 0 0 1-4.4 2.26 5.403 5.403 0 0 1-3.14-9.8c-.44-.06-.9-.1-1.36-.1z">
        </path>
      </svg><svg class="nit-mode-icon nit-mode-icon-light" width="20"
        height="20" viewBox="0 0 24 24" aria-hidden="true"
        style="display: block;">
        <path fill="currentColor"
          d="M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zM2 13h2c.55 0 1-.45 1-1s-.45-1-1-1H2c-.55 0-1 .45-1 1s.45 1 1 1zm18 0h2c.55 0 1-.45 1-1s-.45-1-1-1h-2c-.55 0-1 .45-1 1s.45 1 1 1zM11 2v2c0 .55.45 1 1 1s1-.45 1-1V2c0-.55-.45-1-1-1s-1 .45-1 1zm0 18v2c0 .55.45 1 1 1s1-.45 1-1v-2c0-.55-.45-1-1-1s-1 .45-1 1zM5.99 4.58a.996.996 0 0 0-1.41 0 .996.996 0 0 0 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41L5.99 4.58zm12.37 12.37a.996.996 0 0 0-1.41 0 .996.996 0 0 0 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0a.996.996 0 0 0 0-1.41l-1.06-1.06zm1.06-10.96a.996.996 0 0 0 0-1.41.996.996 0 0 0-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06zM7.05 18.36a.996.996 0 0 0 0-1.41.996.996 0 0 0-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06z">
        </path>
      </svg><span class="visually-hidden nit-mode-toggle-label">Switch mode</span></a>
    <script>
      // Primes the two controls from the navbar's payloads. Runs inline, as
      // the page is parsed, because the theme's click handler reads the mode
      // config once when it binds. No less-than character in here.
      (function() {
        var here = document.currentScript;
        var box = here ? here.parentNode : document;
        var m = window.NIT_MODE_TOGGLE;
        var l = window.NIT_LANG_TOGGLE;
        box.querySelectorAll('[data-nit-hero-mode]').forEach(function(b) {
          if (!m || !m.config) {
            b.style.display = 'none';
            return;
          }
          b.setAttribute('data-nit-mode', m.mode);
          b.setAttribute('data-nit-mode-config', JSON.stringify(m.config));
          b.setAttribute('aria-label', m.label);
          b.setAttribute('title', m.label);
          var dark = m.mode === 'dark';
          b.querySelectorAll('.nit-mode-icon').forEach(function(icon) {
            var forLight = icon.classList.contains('nit-mode-icon-light');
            icon.style.display = (forLight === dark) ? 'block' : 'none';
          });
          var sr = b.querySelector('.nit-mode-toggle-label');
          if (sr) {
            sr.textContent = m.label;
          }
        });
        box.querySelectorAll('[data-nit-hero-lang]').forEach(function(a) {
          if (!l || !l.url) {
            a.style.display = 'none';
            return;
          }
          a.setAttribute('href', l.url);
          a.setAttribute('title', l.title);
          a.setAttribute('aria-label', l.title);
          if (l.langcode) {
            a.setAttribute('hreflang', l.langcode);
          }
          var label = a.querySelector('[data-nit-hero-lang-label]');
          if (label) {
            label.textContent = l.label;
          }
        });
      })();
    </script>
  </div>
  <div
    style="position: relative; z-index: 1; width: 100%; max-width: 1280px; margin: 0 auto; display: flex; flex-direction: column; align-items: center; gap: 25px;">
    <div
      style="display: flex; justify-content: center; width: 100%; margin-bottom: clamp(32px, 6vw, 84px);">
      <img class="img-fluid" src="/moodle-new/theme/nit/pix/footer-logo.png"
        alt="EAAC" data-nit-catcards-brand="" data-nit-logo="full"></div>
    <div style="width: 100%; display: flex; flex-direction: column; gap: 8px; text-align: center;">
      <p
        style="margin: 0; font-size: clamp(16px, 1.6vw, 22px); font-weight: 600; line-height: normal; color: var(--nit-brand-primary);">
        {mlang ar}استكشاف الفئة الرئيسية{mlang}{mlang other}Explore the main categories{mlang}</p>
      <h2
        style="margin: 0; font-size: clamp(24px, 2.6vw, 36px); font-weight: 700; line-height: normal; color: var(--nit-brand-textprimary);">
        {mlang ar}دورات تدريبية في جميع المجالات{mlang}{mlang other}Training courses in every field{mlang}</h2>
    </div>
    <div style="width: 100%;" data-nit-catcards-grid="" data-ids="" data-limit="6">
      <span style="display: block; text-align: center; opacity: .6;">...</span>
    </div>
  </div>
  <script>
    // Loads the behaviour. Keep this short and keep the "less than" character
    // out of it - see the note at the top of this file.
    (function() {
      var here = document.currentScript;
      var base = (window.M && M.cfg && M.cfg.wwwroot) ? M.cfg.wwwroot : '';
      var s = document.createElement('script');
      s.src = base + '/theme/nit/blocks/js.php?name=home_categories_cards';
      (here && here.parentNode ? here.parentNode : document.body).appendChild(s);
    })();
  </script>
</div>
