<!-- NIT — Available coupons home-page block. Paste into an HTML block on the home page.
     Inline styles only (editor-safe). Fetches live coupons from the plugin and renders a dark slider.
     Shows: code, discount value, applies-to scope, per-student usage limit, valid dates.
     Colours read from the Brand Colors palette (theme/nit gallery). Gold accents map to
     --nit-brand-accent, the teal "positive" accent maps to --nit-brand-success; shades are
     derived with color-mix from those same brand variables (no hard-coded colours).
     A card's two buttons are the theme's own two button components and carry NO colour of
     their own: the code chip (tap to copy) is the Main button (.btn.btn-primary) and "View
     details" is the Outline button (brand) (.btn.btn-outline-primary), so fill, label,
     ring and hover all come from those two blocks of the Brand Colors editor — the same
     two every other button on the category page is drawn with. Only size, shape and the
     chip's monospace face are inline; the copy feedback is still a 1.2 s success ring set
     by the script.
     The server sends only the coupons this visitor could actually redeem (AC-4.7.10), so
     the block starts hidden and shows itself only once it has at least one card: a visitor
     with nothing to claim sees no block and no gap where one would have been (AC-4.7.11).
     Optional: if it can't find the API, set data-base on the wrapper to your Moodle URL,
     e.g. data-base="https://academy2026.nitg-eg.com/moodle-new"
     Set data-category="<id>" to list only the coupons belonging to one course category and its
     branch, plus the site-wide ones (what local/nit_category/index.php does); leave it off and
     the block lists every coupon this visitor could redeem. -->
<div dir="auto"
  style="display: none; background: var(--nit-brand-background); padding: 64px 16px;"
  data-nit-coupons="" data-endpoint="/local/nit_commerce/api.php" data-base="">
  <div style="max-width: 1200px; margin: 0 auto;"><!-- Header -->
    <div
      style="text-align: center; margin-bottom: 40px; color: var(--nit-brand-textprimary);">
      <span
        style="display: inline-block; background: transparent; border: 1px solid var(--nit-brand-accent); border-radius: 16px; padding: 5px 16px; font-size: 16px; line-height: 1.6; color: var(--nit-brand-accentwords); font-weight: 500;">
        {mlang en}Discounts{mlang}{mlang ar}الخصومات{mlang} </span>
      <h2
        style="font-size: clamp(26px, 3.4vw, 36px); font-weight: 600; line-height: 1.4; margin: 16px 0 0; color: var(--nit-brand-textprimary);">
        {mlang en}Available coupons{mlang}{mlang ar}الكوبونات المتاحة{mlang}
      </h2>
    </div>
    <!-- Slider Wrapper. The arrows start hidden: the script shows them only once the cards
         are wider than the rail (and hides them again if a resize makes everything fit), and
         a rail that fits is centred — see fit() below. -->
    <div style="position: relative; padding: 0 28px;"><!-- LEFT ARROW -->
      <button
        style="display: none; position: absolute; inset-inline-start: -23px; top: 50%; transform: translateY(-50%); z-index: 20; width: 46px; height: 46px; align-items: center; justify-content: center; border-radius: 50%; border: 1px solid color-mix(in srgb, var(--nit-brand-accent) 50%, transparent); background: var(--nit-brand-surface); color: var(--nit-brand-accent); font-size: 29px; font-weight: bold; line-height: 1; padding: 0; cursor: pointer; box-shadow: 0 8px 24px rgba(0,0,0,.35);"
        type="button" data-nit-coupons-scroll="prev"> ‹ </button>
      <!-- COUPONS HORIZONTAL SCROLL -->
      <div
        style="display: flex; flex-direction: row; flex-wrap: nowrap; align-items: stretch; justify-content: center; gap: 20px; width: 100%; overflow-x: auto; overflow-y: hidden; padding: 8px 4px 20px; scroll-snap-type: x mandatory; scroll-behavior: smooth; scrollbar-width: thin; scrollbar-color: var(--nit-brand-accent) var(--nit-brand-surface); -webkit-overflow-scrolling: touch;"
        data-nit-coupons-scroller=""><!-- CARD TEMPLATE -->
        <div
          style="display: none; flex: 0 0 min(350px, 100%); width: min(350px, 100%); min-width: 0; max-width: 350px; scroll-snap-align: start; align-self: stretch;"
          data-nit-coupons-card="">
          <!-- The Figma coupon: a 350-wide ticket, everything centred — the site mark, the
               discount, a perforation, the coupon's name, the code in a dashed box (tap to
               copy) and the outlined "View details". The two half-circle bites on the side
               edges are discs in the page colour, half clipped by the ticket's own overflow. -->
          <div
            style="position: relative; box-sizing: border-box; width: 100%; height: 100%; min-height: 328px; display: flex; flex-direction: column; align-items: center; gap: 0; text-align: center; background: var(--nit-brand-surface); border: 1px solid color-mix(in srgb, var(--nit-brand-accent) 70%, transparent); border-radius: 13px; padding: 23px 31px 23px; overflow: hidden; color: var(--nit-brand-textprimary);">
            <span aria-hidden="true"
              style="position: absolute; top: 196px; inset-inline-start: -12px; width: 22px; height: 22px; box-sizing: border-box; border-radius: 50%; background: var(--nit-brand-background); border: 1px solid color-mix(in srgb, var(--nit-brand-accent) 70%, transparent);"></span>
            <span aria-hidden="true"
              style="position: absolute; top: 196px; inset-inline-end: -12px; width: 22px; height: 22px; box-sizing: border-box; border-radius: 50%; background: var(--nit-brand-background); border: 1px solid color-mix(in srgb, var(--nit-brand-accent) 70%, transparent);"></span>
            <!-- Site mark: the navbar's own logo, copied in by the script (hidden if none). -->
            <img alt="" style="display: none; height: 30px; max-width: 120px; object-fit: contain; margin: 0 0 8px;"
              data-nit-logo="">
            <strong style="display: block; font-size: 28px; font-weight: 700; line-height: 1.25; color: var(--nit-brand-textprimary); direction: ltr; unicode-bidi: isolate;"
              data-nit-value="">{{value}}</strong>
            <span
              style="display: block; font-size: 16px; font-weight: 400; line-height: 1.4; margin-top: 4px; color: var(--nit-brand-textprimary);"
              data-nit-valuelabel="">{{valuelabel}}</span>
            <!-- Perforation -->
            <div aria-hidden="true"
              style="align-self: stretch; height: 0; margin: 20px 0 16px; border-top: 3px dashed color-mix(in srgb, var(--nit-brand-textsecondary) 45%, transparent);">
            </div>
            <p
              style="margin: 0; max-width: 100%; font-size: 14px; font-weight: 500; line-height: 20px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;"
              data-nit-name="">{{name}}</p>
            <p
              style="display: none; margin: 6px 0 0; font-size: 12.5px; line-height: 1.6; color: var(--nit-brand-textsecondary); overflow: hidden; -webkit-line-clamp: 2; -webkit-box-orient: vertical;"
              data-nit-desc="">{{description}}</p>
            <!-- The code, in the design's dashed box. A copy control rather than a button
                 component, so it carries no fill; the shared hover rule lights it up. -->
            <button
              style="display: inline-flex; align-items: center; justify-content: center; gap: 10px; width: 100%; max-width: 241px; height: 36px; margin-top: 16px; padding: 0 12px; box-sizing: border-box; background: rgba(0,0,0,.03); border: 1px dashed color-mix(in srgb, var(--nit-brand-textprimary) 16%, transparent); border-radius: 6px; color: var(--nit-brand-textprimary); font-size: 14px; font-weight: 500; letter-spacing: .5px; cursor: pointer;"
              type="button" data-nit-copy="" data-code="{{code}}"><span
                data-nit-codetext="">{{code}}</span> <span aria-hidden="true" style="opacity: .7;">⧉</span></button>
            <!-- Meta chips: not in the design, kept because they are the coupon's terms. -->
            <div style="display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; margin-top: 10px;"><span
                style="display: none; font-size: 11.5px; font-weight: 600; color: var(--nit-brand-textsecondary); background: color-mix(in srgb, var(--nit-brand-textprimary) 6%, transparent); border-radius: 50px; padding: 3px 10px;"
                data-nit-usage="">{{usage}}</span> <span
                style="display: none; font-size: 11.5px; font-weight: 600; color: var(--nit-brand-textsecondary); background: color-mix(in srgb, var(--nit-brand-textprimary) 6%, transparent); border-radius: 50px; padding: 3px 10px;"
                data-nit-dates="">{{dates}}</span></div>
            <div style="align-self: stretch; margin-top: auto; padding-top: 20px;">
              <a class="btn btn-outline-primary"
                style="display: flex; align-items: center; justify-content: center; box-sizing: border-box; width: 100%; height: 46px; padding: 0 24px; border-radius: 8px; font-weight: 500; font-size: 15px;"
                href="#" data-nit-details="">{mlang en}View details{mlang}{mlang
                ar}عرض التفاصيل{mlang}</a></div>
          </div>
        </div>
      </div>
      <!-- RIGHT ARROW --> <button
        style="display: none; position: absolute; inset-inline-end: -23px; top: 50%; transform: translateY(-50%); z-index: 20; width: 46px; height: 46px; align-items: center; justify-content: center; border-radius: 50%; border: 1px solid color-mix(in srgb, var(--nit-brand-accent) 50%, transparent); background: var(--nit-brand-surface); color: var(--nit-brand-accent); font-size: 29px; font-weight: bold; line-height: 1; padding: 0; cursor: pointer; box-shadow: 0 8px 24px rgba(0,0,0,.35);"
        type="button" data-nit-coupons-scroll="next"> › </button>
    </div>
  </div>
  <script>
    (function() {
      var root =
        (document.currentScript &&
          document.currentScript.closest('[data-nit-coupons]')) ||
        document.querySelector('[data-nit-coupons]');

      if (!root || root.getAttribute('data-nit-wired')) {
        return;
      }

      root.setAttribute('data-nit-wired', '1');

      var scroller = root.querySelector('[data-nit-coupons-scroller]');

      var navLogo = document.querySelector(
        '.navbar .navbar-brand img, .navbar-brand img, nav .logo img, header img.logo');
      var siteLogo = navLogo ? (navLogo.currentSrc || navLogo.src) : '';
      var tpl = root.querySelector('[data-nit-coupons-card]');

      /* When the paste lives in a Moodle HTML block, the block's own card is what takes
         up the room on the page: hiding the div inside it would leave the card, its
         padding and its margins behind. */
      var shell = root.closest('[data-nit-section]') || root.closest('.block') || root;

      var base =
        window.M && M.cfg && M.cfg.wwwroot ?
        M.cfg.wwwroot :
        root.getAttribute('data-base') || '';

      /* On a category landing page the rail shows that category's coupons plus the site-wide
         ones; the home page sets no data-category and asks for the lot, as before. */
      var category = parseInt(root.getAttribute('data-category') || '0', 10) || 0;

      var endpoint =
        base +
        root.getAttribute('data-endpoint') +
        '?function=get_available_coupons' +
        (category ? '&categoryid=' + encodeURIComponent(category) : '');

      function esc(s) {
        return String(s == null ? '' : s).replace(
          /[&<>"]/g,
          function(c) {
            return {
              '&': '&amp;',
              '<': '&lt;',
              '>': '&gt;',
              '"': '&quot;'
            } [c];
          }
        );
      }

      /* The description arrives as rendered HTML; the card wants a plain clamped line. */
      function strip(html) {
        var d = document.createElement('div');
        d.innerHTML = html || '';
        return (d.textContent || '').trim();
      }

      function num(n) {
        return (
          Math.round(Number(n) * 100) / 100
        ).toLocaleString(undefined, {
          minimumFractionDigits: 0
        });
      }

      function fmt(ts) {
        return ts ?
          new Date(ts * 1000).toLocaleDateString() :
          null;
      }

      /* The block ships hidden and only ever appears with cards in it, so a catalogue
         that is empty for this visitor — or an API that cannot be reached — leaves no
         header, no arrows and no empty space to reflow around (AC-4.7.11). */
      function reveal() {
        shell.style.display = '';
        root.style.display = '';
      }

      function hide() {
        shell.style.display = 'none';
        root.style.display = 'none';
      }

      /* Arrows only when there is somewhere to scroll TO, and a rail that fits is centred.
         Measured, not counted: how many cards fit depends on the viewport, so the same
         three coupons need arrows on a phone and none on a desktop. A centred flex row
         that overflows clips its first card off the start edge with no way to scroll back
         to it, so the two states are one switch — overflow: start-aligned + arrows;
         fits: centred + no arrows. Re-run on resize, because either can turn into the other. */
      var arrows = root.querySelectorAll('[data-nit-coupons-scroll]');

      function fit() {
        var overflows = scroller.scrollWidth > scroller.clientWidth + 1;
        scroller.style.justifyContent = overflows ? 'flex-start' : 'center';
        Array.prototype.forEach.call(arrows, function(btn) {
          btn.style.display = overflows ? 'flex' : 'none';
        });
      }

      /* Watch the rail itself where the browser can: its width also changes when a
         drawer opens or a late font reflows the page, and neither fires a window resize. */
      if (window.ResizeObserver) {
        new ResizeObserver(fit).observe(scroller);
      } else {
        window.addEventListener('resize', fit);
      }

      /* Slider arrows */
      Array.prototype.forEach.call(
        arrows,
        function(btn) {
          btn.addEventListener('click', function() {
            var dir =
              btn.getAttribute('data-nit-coupons-scroll') === 'next' ?
              1 :
              -1;

            if (
              getComputedStyle(scroller).direction === 'rtl'
            ) {
              dir = -dir;
            }

            scroller.scrollBy({
              left: dir *
                Math.max(
                  320,
                  Math.round(scroller.clientWidth * 0.8)
                ),
              behavior: 'smooth'
            });
          });
        }
      );

      /* Same-origin credentials: which coupons are still usable depends on who is asking
         — the server leaves out the ones this account has already redeemed. */
      fetch(endpoint, {
          headers: {
            Accept: 'application/json'
          },
          credentials: 'same-origin'
        })
        .then(function(r) {
          return r.json();
        })
        .then(function(res) {
          if (!res || res.status !== 'success') {
            throw new Error('load failed');
          }

          var rows = res.data || [];

          /* AC-4.7.11: nothing this visitor can use means no block at all — not a header
             over an empty rail. The block has been hidden since it was rendered, so the
             page never had a gap here to close. */
          if (!rows.length) {
            hide();
            return;
          }

          reveal();

          /* A fixed coupon carries the currency it is written in, and the list only ever
             contains coupons in this visitor's own currency (AC-4.7.10), so the code can
             be printed as it comes rather than assumed. */
          var offLabel =
            '{mlang en}OFF{mlang}{mlang ar}خصم{mlang}';

          rows.forEach(function(c) {
            var isPct =
              c.discount_type === 'percent';

            var value = isPct ?
              num(c.discount_value) + '%' :
              num(c.discount_value);

            /* Name and description are the coupon's own fields; a coupon that has
               neither still needs a heading, and its code is the honest one. */
            var name = (c.name || '').trim() || c.code;
            var description = strip(c.description || '');

            var s = fmt(c.startdate);
            var e = fmt(c.enddate);

            var dates =
              s || e ?
              '{mlang en}Valid{mlang}{mlang ar}صالح{mlang} ' +
              (s || '…') +
              ' → ' +
              (e || '…') :
              '';

            /* The admin's "Usage limit per student" spelled out: how many times ONE student
               may use the code and — when the visitor is signed in — how many of their own
               uses are left. The site-wide cap is not the visitor's concern; it is on the
               details page, and the feed already drops a coupon that has reached it. */
            var usage;

            if (c.user_limit > 0) {
              usage =
                '{mlang en}Per student{mlang}{mlang ar}للطالب الواحد{mlang}: ' +
                '{mlang en}' + c.user_limit + ' time(s){mlang}{mlang ar}' + c.user_limit + ' مرة{mlang}';

              if (c.user_uses_left != null) {
                var left = Math.max(0, c.user_uses_left);
                usage +=
                  ' — {mlang en}' + left + ' left for you{mlang}{mlang ar}متبقٍ لك ' + left + '{mlang}';
              }
            } else {
              usage =
                '{mlang en}Per student: unlimited{mlang}{mlang ar}للطالب الواحد: غير محدود{mlang}';
            }
            var html = tpl.innerHTML
              .replace(/\{\{value\}\}/g, esc(value))
              .replace(
                /\{\{valuelabel\}\}/g,
                isPct ? offLabel : ((c.currency || '') + ' ' + offLabel).trim()
              )
              .replace(/\{\{code\}\}/g, esc(c.code))
              .replace(/\{\{name\}\}/g, esc(name))
              .replace(/\{\{description\}\}/g, esc(description))
              .replace(/\{\{usage\}\}/g, esc(usage))
              .replace(/\{\{dates\}\}/g, esc(dates));

            var wrap = document.createElement('div');

            wrap.style.cssText =
              tpl
              .getAttribute('style')
              .replace('display: none;', '');

            /*
             * Make generated cards flex containers so every card stretches
             * to the height of the tallest card in the row.
             */
            wrap.style.display = 'flex';
            wrap.style.alignItems = 'stretch';

            wrap.setAttribute(
              'data-nit-coupons-card',
              ''
            );

            wrap.innerHTML = html;

            /* Every optional line starts hidden in the template and is switched on only
               when the coupon actually has one, so a sparse coupon leaves no empty gaps. */
            function show(sel, on, how) {
              var el = wrap.querySelector(sel);

              if (el && on) {
                el.style.display = how;
              }
            }

            show('[data-nit-desc]', !!description, '-webkit-box');
            show('[data-nit-usage]', !!usage, 'inline-block');
            show('[data-nit-dates]', !!dates, 'inline-block');

            var details =
              wrap.querySelector('[data-nit-details]');

            if (details) {
              details.href =
                base +
                '/local/nit_commerce/coupon.php?id=' +
                encodeURIComponent(c.id);
            }

            /* The Figma ticket carries the site mark. Borrow the navbar's own logo — it is
               already the right one for this category and this light/dark mode — and leave
               the slot hidden on a page that has none. */
            var logo = wrap.querySelector('[data-nit-logo]');
            if (logo && siteLogo) {
              logo.src = siteLogo;
              logo.style.display = 'block';
            }

            var btn =
              wrap.querySelector('[data-nit-copy]');

            if (btn) {
              btn.addEventListener(
                'click',
                function() {
                  var code =
                    btn.getAttribute('data-code');

                  if (navigator.clipboard) {
                    navigator.clipboard
                      .writeText(code)
                      .catch(function() {});
                  }

                  var old =
                    btn.style.borderColor;

                  btn.style.borderColor =
                    'var(--nit-brand-success)';

                  setTimeout(function() {
                    btn.style.borderColor = old;
                  }, 1200);
                }
              );
            }

            scroller.appendChild(wrap);
          });

          /* Every card is in the rail now, so its width is known. Measure at once (the
             block was display:none a moment ago, so this forces its first layout) and
             again on the next frame, once fonts and scrollbars have settled. */
          fit();
          requestAnimationFrame(fit);
        })
        .catch(function() {
          hide();
        });
    })();
  </script>
  <script>
    (function() {
      if (document.getElementById('nit-hoverfx-style')) {
        return;
      }
      var css =
        '.nit-btn-solid,.nit-btn-ghost,[data-nit-copy],[data-nit-scroll],[data-nit-coupons-scroll],[data-nit-categories]>a,[data-nit-my-courses]>div,[data-nit-about-card]{transition:background-color .2s ease,background .2s ease,color .2s ease,border-color .2s ease,transform .2s ease,box-shadow .2s ease}' +
        '.nit-btn-solid:not(:disabled):hover{filter:brightness(.9);transform:translateY(-2px);box-shadow:0 10px 24px rgba(0,0,0,.35)}' +
        '.nit-btn-ghost:not(:disabled):hover{background:var(--nit-brand-hoverbackground)!important;color:var(--nit-brand-hovertext)!important;border-color:var(--nit-brand-bordersecondary)!important;transform:translateY(-2px);box-shadow:0 10px 24px rgba(0,0,0,.35)}' +
        '[data-nit-copy]:not(.btn):hover{background:var(--nit-brand-hoverbackground)!important;color:var(--nit-brand-hovertext)!important;border-color:var(--nit-brand-hoverbackground)!important;transform:translateY(-2px);box-shadow:0 10px 24px rgba(0,0,0,.35)}' +
        '[data-nit-scroll]:hover,[data-nit-coupons-scroll]:hover{background:var(--nit-brand-hoverbackground)!important;color:var(--nit-brand-hovertext)!important;border-color:var(--nit-brand-hoverbackground)!important;transform:translateY(-50%) scale(1.08)!important}' +
        '[data-nit-categories]>a:hover,[data-nit-my-courses]>div:not([data-nit-my-course-card]):not([data-nit-my-courses-empty]):hover{transform:translateY(-6px);border-color:var(--nit-brand-accent)!important;box-shadow:0 16px 40px rgba(0,0,0,.45)}' +
        '[data-nit-categories]>a:hover [data-nit-cta]{background:var(--nit-brand-primary-hover)!important;color:var(--nit-brand-onprimary)!important}' +
        '[data-nit-about-card]:hover{transform:translateY(-4px);border-color:var(--nit-brand-accent)!important}';
      var st = document.createElement('style');
      st.id = 'nit-hoverfx-style';
      st.textContent = css;
      (document.head || document.documentElement).appendChild(st);
    })();
  </script>
</div>
