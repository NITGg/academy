<!-- NIT — Available coupons home-page block. Paste into an HTML block on the home page.
     Inline styles only (editor-safe). Fetches live coupons from the plugin and renders a dark slider.
     Shows: code, discount value, applies-to scope, usage type, max discount, valid dates.
     Colours read from the Brand Colors palette (theme/nit gallery). Gold accents map to
     --nit-brand-accent, the teal "positive" accent maps to --nit-brand-success; shades are
     derived with color-mix from those same brand variables (no hard-coded colours).
     The server sends only the coupons this visitor could actually redeem (AC-4.7.10), so
     the block starts hidden and shows itself only once it has at least one card: a visitor
     with nothing to claim sees no block and no gap where one would have been (AC-4.7.11).
     Optional: if it can't find the API, set data-base on the wrapper to your Moodle URL,
     e.g. data-base="https://academy2026.nitg-eg.com/moodle-new" -->
<div dir="auto"
  style="display: none; background: var(--nit-brand-background); padding: 64px 16px;"
  data-nit-coupons="" data-endpoint="/local/nit_commerce/api.php" data-base="">
  <div style="max-width: 1200px; margin: 0 auto;"><!-- Header -->
    <div
      style="text-align: center; margin-bottom: 40px; color: var(--nit-brand-textprimary);">
      <span
        style="display: inline-block; background: color-mix(in srgb, var(--nit-brand-accenttext) 15%, transparent); border: 1px solid color-mix(in srgb, var(--nit-brand-accenttext) 30%, transparent); border-radius: 50px; padding: 6px 18px; font-size: 14px; color: var(--nit-brand-accenttext); font-weight: bold;">
        {mlang en}Discounts{mlang}{mlang ar}الخصومات{mlang} </span>
      <h2
        style="font-size: clamp(26px, 4vw, 38px); font-weight: 800; margin: 16px 0 0; color: var(--nit-brand-textprimary);">
        {mlang en}Available coupons{mlang}{mlang ar}الكوبونات المتاحة{mlang}
      </h2>
    </div>
    <!-- Slider Wrapper -->
    <div style="position: relative; padding: 0 28px;"><!-- LEFT ARROW -->
      <button
        style="position: absolute; inset-inline-start: -23px; top: 50%; transform: translateY(-50%); z-index: 20; width: 46px; height: 46px; display: flex; align-items: center; justify-content: center; border-radius: 50%; border: 1px solid color-mix(in srgb, var(--nit-brand-accent) 50%, transparent); background: var(--nit-brand-surface); color: var(--nit-brand-accent); font-size: 29px; font-weight: bold; line-height: 1; padding: 0; cursor: pointer; box-shadow: 0 8px 24px rgba(0,0,0,.35);"
        type="button" data-nit-coupons-scroll="prev"> ‹ </button>
      <!-- COUPONS HORIZONTAL SCROLL -->
      <div
        style="display: flex; flex-direction: row; flex-wrap: nowrap; align-items: stretch; gap: 20px; width: 100%; overflow-x: auto; overflow-y: hidden; padding: 8px 4px 20px; scroll-snap-type: x mandatory; scroll-behavior: smooth; scrollbar-width: thin; scrollbar-color: var(--nit-brand-accent) var(--nit-brand-surface); -webkit-overflow-scrolling: touch;"
        data-nit-coupons-scroller=""><!-- CARD TEMPLATE -->
        <div
          style="display: none; flex: 0 0 340px; width: 340px; min-width: 340px; max-width: 340px; scroll-snap-align: start; align-self: stretch;"
          data-nit-coupons-card="">
          <div
            style="box-sizing: border-box; width: 100%; height: 100%; display: flex; flex-direction: column; background: var(--nit-brand-surface); border: 1px solid color-mix(in srgb, var(--nit-brand-accent) 32%, transparent); border-radius: 18px; overflow: hidden; box-shadow: 0 14px 34px rgba(0,0,0,.22);">
            <!-- VALUE BAND: the discount, and next to it the coupon's own name (the new
                 name/description fields) rather than the raw code — the code has its own chip
                 below, where it can be copied. -->
            <div
              style="display: flex; align-items: center; gap: 14px; padding: 18px 20px; background: linear-gradient(135deg, color-mix(in srgb, var(--nit-brand-accent) 78%, #000), var(--nit-brand-accent)); color: var(--nit-brand-on-primary, #fff);">
              <div
                style="flex: 0 0 auto; display: flex; flex-direction: column; align-items: center; line-height: 1;">
                <strong style="font-size: 31px; font-weight: 800; letter-spacing: -1px;"
                  data-nit-value="">{{value}}</strong> <span
                  style="font-size: 10px; font-weight: 800; letter-spacing: 1.3px; text-transform: uppercase; opacity: .92; margin-top: 5px;"
                  data-nit-valuelabel="">{{valuelabel}}</span></div>
              <div style="flex: 1 1 auto; min-width: 0;">
                <p
                  style="margin: 0; font-size: 16px; font-weight: 800; line-height: 1.35; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;"
                  data-nit-name="">{{name}}</p>
                <p
                  style="display: none; margin: 4px 0 0; font-size: 11.5px; font-weight: 600; opacity: .9;"
                  data-nit-max="">{{max}}</p>
              </div>
            </div>
            <!-- Perforation, so the card reads as a torn-off ticket. -->
            <div
              style="height: 0; border-top: 2px dashed color-mix(in srgb, var(--nit-brand-textprimary) 14%, transparent);">
            </div>
            <!-- BODY -->
            <div
              style="flex: 1 1 auto; min-width: 0; padding: 18px 20px; display: flex; flex-direction: column; gap: 12px;">
              <p
                style="display: none; margin: 0; font-size: 13px; line-height: 1.7; color: var(--nit-brand-textsecondary); overflow: hidden; -webkit-line-clamp: 2; -webkit-box-orient: vertical;"
                data-nit-desc="">{{description}}</p>
              <button
                style="align-self: stretch; display: inline-flex; align-items: center; justify-content: center; gap: 10px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-weight: bold; font-size: 16px; letter-spacing: 1px; color: var(--nit-brand-textprimary); background: color-mix(in srgb, var(--nit-brand-textprimary) 6%, transparent); border: 1px dashed color-mix(in srgb, var(--nit-brand-accent) 50%, transparent); border-radius: 10px; padding: 10px 14px; cursor: pointer;"
                type="button" data-nit-copy="" data-code="{{code}}"><span
                  data-nit-codetext="">{{code}}</span> <span aria-hidden="true">⧉</span></button>
              <!-- Meta chips. What the coupon applies to is NOT here any more: one truncated
                   line could not carry it. It is on the details page in full. -->
              <div style="display: flex; flex-wrap: wrap; gap: 7px;"><span
                  style="display: none; font-size: 11.5px; font-weight: 600; color: var(--nit-brand-textsecondary); background: color-mix(in srgb, var(--nit-brand-textprimary) 6%, transparent); border-radius: 50px; padding: 4px 11px;"
                  data-nit-usage="">{{usage}}</span> <span
                  style="display: none; font-size: 11.5px; font-weight: 600; color: var(--nit-brand-textsecondary); background: color-mix(in srgb, var(--nit-brand-textprimary) 6%, transparent); border-radius: 50px; padding: 4px 11px;"
                  data-nit-dates="">{{dates}}</span></div>
              <a class="nit-btn-ghost"
                style="display: block; box-sizing: border-box; margin-top: auto; background: transparent; border: 1px solid var(--nit-brand-bordersecondary); color: var(--nit-brand-textprimary); padding: 11px; border-radius: 10px; font-weight: bold; font-size: 13.5px; text-align: center; text-decoration: none;"
                href="#" data-nit-details="">{mlang en}View details{mlang}{mlang
                ar}عرض التفاصيل{mlang}</a>
            </div>
          </div>
        </div>
      </div>
      <!-- RIGHT ARROW --> <button
        style="position: absolute; inset-inline-end: -23px; top: 50%; transform: translateY(-50%); z-index: 20; width: 46px; height: 46px; display: flex; align-items: center; justify-content: center; border-radius: 50%; border: 1px solid color-mix(in srgb, var(--nit-brand-accent) 50%, transparent); background: var(--nit-brand-surface); color: var(--nit-brand-accent); font-size: 29px; font-weight: bold; line-height: 1; padding: 0; cursor: pointer; box-shadow: 0 8px 24px rgba(0,0,0,.35);"
        type="button" data-nit-coupons-scroll="next"> › </button>
    </div>
  </div>
  <script>
    (function() {
      var root =
        (document.currentScript &&
          document.currentScript.closest('[data-nit-coupons]')) ||
        document.querySelector('[data-nit-coupons]');

      if (!root || root.getAttribute('data-nit-wired')) {
        return;
      }

      root.setAttribute('data-nit-wired', '1');

      var scroller = root.querySelector('[data-nit-coupons-scroller]');
      var tpl = root.querySelector('[data-nit-coupons-card]');

      /* When the paste lives in a Moodle HTML block, the block's own card is what takes
         up the room on the page: hiding the div inside it would leave the card, its
         padding and its margins behind. */
      var shell = root.closest('[data-nit-section]') || root.closest('.block') || root;

      var base =
        window.M && M.cfg && M.cfg.wwwroot ?
        M.cfg.wwwroot :
        root.getAttribute('data-base') || '';

      var endpoint =
        base +
        root.getAttribute('data-endpoint') +
        '?function=get_available_coupons';

      function esc(s) {
        return String(s == null ? '' : s).replace(
          /[&<>"]/g,
          function(c) {
            return {
              '&': '&amp;',
              '<': '&lt;',
              '>': '&gt;',
              '"': '&quot;'
            } [c];
          }
        );
      }

      /* The description arrives as rendered HTML; the card wants a plain clamped line. */
      function strip(html) {
        var d = document.createElement('div');
        d.innerHTML = html || '';
        return (d.textContent || '').trim();
      }

      function num(n) {
        return (
          Math.round(Number(n) * 100) / 100
        ).toLocaleString(undefined, {
          minimumFractionDigits: 0
        });
      }

      function fmt(ts) {
        return ts ?
          new Date(ts * 1000).toLocaleDateString() :
          null;
      }

      /* The block ships hidden and only ever appears with cards in it, so a catalogue
         that is empty for this visitor — or an API that cannot be reached — leaves no
         header, no arrows and no empty space to reflow around (AC-4.7.11). */
      function reveal() {
        shell.style.display = '';
        root.style.display = '';
      }

      function hide() {
        shell.style.display = 'none';
        root.style.display = 'none';
      }

      /* Slider arrows */
      Array.prototype.forEach.call(
        root.querySelectorAll('[data-nit-coupons-scroll]'),
        function(btn) {
          btn.addEventListener('click', function() {
            var dir =
              btn.getAttribute('data-nit-coupons-scroll') === 'next' ?
              1 :
              -1;

            if (
              getComputedStyle(scroller).direction === 'rtl'
            ) {
              dir = -dir;
            }

            scroller.scrollBy({
              left: dir *
                Math.max(
                  320,
                  Math.round(scroller.clientWidth * 0.8)
                ),
              behavior: 'smooth'
            });
          });
        }
      );

      /* Same-origin credentials: which coupons are still usable depends on who is asking
         — the server leaves out the ones this account has already redeemed. */
      fetch(endpoint, {
          headers: {
            Accept: 'application/json'
          },
          credentials: 'same-origin'
        })
        .then(function(r) {
          return r.json();
        })
        .then(function(res) {
          if (!res || res.status !== 'success') {
            throw new Error('load failed');
          }

          var rows = res.data || [];

          /* AC-4.7.11: nothing this visitor can use means no block at all — not a header
             over an empty rail. The block has been hidden since it was rendered, so the
             page never had a gap here to close. */
          if (!rows.length) {
            hide();
            return;
          }

          reveal();

          /* A fixed coupon carries the currency it is written in, and the list only ever
             contains coupons in this visitor's own currency (AC-4.7.10), so the code can
             be printed as it comes rather than assumed. */
          var offLabel =
            '{mlang en}OFF{mlang}{mlang ar}خصم{mlang}';

          rows.forEach(function(c) {
            var isPct =
              c.discount_type === 'percent';

            var value = isPct ?
              num(c.discount_value) + '%' :
              num(c.discount_value);

            /* Name and description are the coupon's own fields; a coupon that has
               neither still needs a heading, and its code is the honest one. */
            var name = (c.name || '').trim() || c.code;
            var description = strip(c.description || '');

            var s = fmt(c.startdate);
            var e = fmt(c.enddate);

            var dates =
              s || e ?
              '{mlang en}Valid{mlang}{mlang ar}صالح{mlang} ' +
              (s || '…') +
              ' → ' +
              (e || '…') :
              '';

            /* Usage type */
            var usage;

            if (c.usage_type === 'once') {
              usage =
                '{mlang en}One-time use{mlang}{mlang ar}استخدام لمرة واحدة{mlang}';
            } else {
              usage =
                '{mlang en}Multiple use{mlang}{mlang ar}استخدام متعدد{mlang}';

              if (c.usage_limit > 0) {
                usage +=
                  ' (' +
                  (c.usage_count || 0) +
                  '/' +
                  c.usage_limit +
                  ')';
              }
            }

            /* Max discount */
            var max =
              c.max_discount != null &&
              Number(c.max_discount) > 0 ?
              '{mlang en}Max discount{mlang}{mlang ar}أقصى خصم{mlang}: ' +
              (num(c.max_discount) + ' ' + (c.currency || '')).trim() :
              '';

            var html = tpl.innerHTML
              .replace(/\{\{value\}\}/g, esc(value))
              .replace(
                /\{\{valuelabel\}\}/g,
                isPct ? offLabel : ((c.currency || '') + ' ' + offLabel).trim()
              )
              .replace(/\{\{code\}\}/g, esc(c.code))
              .replace(/\{\{name\}\}/g, esc(name))
              .replace(/\{\{description\}\}/g, esc(description))
              .replace(/\{\{usage\}\}/g, esc(usage))
              .replace(/\{\{max\}\}/g, esc(max))
              .replace(/\{\{dates\}\}/g, esc(dates));

            var wrap = document.createElement('div');

            wrap.style.cssText =
              tpl
              .getAttribute('style')
              .replace('display: none;', '');

            /*
             * Make generated cards flex containers so every card stretches
             * to the height of the tallest card in the row.
             */
            wrap.style.display = 'flex';
            wrap.style.alignItems = 'stretch';

            wrap.setAttribute(
              'data-nit-coupons-card',
              ''
            );

            wrap.innerHTML = html;

            /* Every optional line starts hidden in the template and is switched on only
               when the coupon actually has one, so a sparse coupon leaves no empty gaps. */
            function show(sel, on, how) {
              var el = wrap.querySelector(sel);

              if (el && on) {
                el.style.display = how;
              }
            }

            show('[data-nit-desc]', !!description, '-webkit-box');
            show('[data-nit-max]', !!max, 'block');
            show('[data-nit-usage]', !!usage, 'inline-block');
            show('[data-nit-dates]', !!dates, 'inline-block');

            var details =
              wrap.querySelector('[data-nit-details]');

            if (details) {
              details.href =
                base +
                '/local/nit_commerce/coupon.php?id=' +
                encodeURIComponent(c.id);
            }

            var btn =
              wrap.querySelector('[data-nit-copy]');

            if (btn) {
              btn.addEventListener(
                'click',
                function() {
                  var code =
                    btn.getAttribute('data-code');

                  if (navigator.clipboard) {
                    navigator.clipboard
                      .writeText(code)
                      .catch(function() {});
                  }

                  var old =
                    btn.style.borderColor;

                  btn.style.borderColor =
                    'var(--nit-brand-success)';

                  setTimeout(function() {
                    btn.style.borderColor = old;
                  }, 1200);
                }
              );
            }

            scroller.appendChild(wrap);
          });
        })
        .catch(function() {
          hide();
        });
    })();
  </script>
  <script>
    (function() {
      if (document.getElementById('nit-hoverfx-style')) {
        return;
      }
      var css =
        '.nit-btn-solid,.nit-btn-ghost,[data-nit-copy],[data-nit-scroll],[data-nit-coupons-scroll],[data-nit-categories]>a,[data-nit-my-courses]>div,[data-nit-about-card]{transition:background-color .2s ease,background .2s ease,color .2s ease,border-color .2s ease,transform .2s ease,box-shadow .2s ease}' +
        '.nit-btn-solid:not(:disabled):hover{background:var(--nit-brand-primary-hover)!important;color:var(--nit-brand-textprimary)!important;transform:translateY(-2px);box-shadow:0 10px 24px rgba(0,0,0,.35)}' +
        '.nit-btn-ghost:not(:disabled):hover{background:var(--nit-brand-hoverbackground)!important;color:var(--nit-brand-hovertext)!important;border-color:var(--nit-brand-bordersecondary)!important;transform:translateY(-2px);box-shadow:0 10px 24px rgba(0,0,0,.35)}' +
        '[data-nit-copy]:hover{background:var(--nit-brand-hoverbackground)!important;color:var(--nit-brand-hovertext)!important;border-color:var(--nit-brand-hoverbackground)!important;transform:translateY(-2px);box-shadow:0 10px 24px rgba(0,0,0,.35)}' +
        '[data-nit-scroll]:hover,[data-nit-coupons-scroll]:hover{background:var(--nit-brand-hoverbackground)!important;color:var(--nit-brand-hovertext)!important;border-color:var(--nit-brand-hoverbackground)!important;transform:translateY(-50%) scale(1.08)!important}' +
        '[data-nit-categories]>a:hover,[data-nit-my-courses]>div:not([data-nit-my-course-card]):not([data-nit-my-courses-empty]):hover{transform:translateY(-6px);border-color:var(--nit-brand-accent)!important;box-shadow:0 16px 40px rgba(0,0,0,.45)}' +
        '[data-nit-categories]>a:hover [data-nit-cta]{background:var(--nit-brand-primary-hover)!important;color:var(--nit-brand-textprimary)!important}' +
        '[data-nit-about-card]:hover{transform:translateY(-4px);border-color:var(--nit-brand-accent)!important}';
      var st = document.createElement('style');
      st.id = 'nit-hoverfx-style';
      st.textContent = css;
      (document.head || document.documentElement).appendChild(st);
    })();
  </script>
</div>
